<h1 id="%E9%9F%B3%E3%81%AF%E3%82%B5%E3%82%A4%E3%83%B3%E6%B3%A2%E3%81%AE%E9%87%8D%E3%81%AD%E5%90%88%E3%82%8F%E3%81%9B">音はサイン波の重ね合わせ</h1>
<p>自然界の音はどんなに複雑でも、<strong>単純なサイン波（正弦波）の足し算</strong>で表せる。</p>
<p><strong>例：ピアノの「ラ（440 Hz）」は</strong></p>
<ul>
<li>基音：440 Hz のサイン波（最も大きい）</li>

<header>音声処理と認識｜第4回</header>
<h1 id="fft%E3%82%92python%E3%81%A7%E8%A8%88%E7%AE%97%E3%81%97%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86">FFTをPythonで計算してみよう</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np
<span class="hljs-keyword">import</span> matplotlib.pyplot <span class="hljs-keyword">as</span> plt

<span class="hljs-comment"># サンプリング設定</span>
fs = <span class="hljs-number">44100</span>         <span class="hljs-comment"># サンプリング周波数（Hz）</span>
duration = <span class="hljs-number">0.1</span>     <span class="hljs-comment"># 信号の長さ（秒）</span>
t = np.linspace(<span class="hljs-number">0</span>, duration, <span class="hljs-built_in">int</span>(fs * duration), endpoint=<span class="hljs-literal">False</span>)

<span class="hljs-comment"># 440 Hz と 880 Hz のサイン波を合成</span>
x = np.sin(<span class="hljs-number">2</span> * np.pi * <span class="hljs-number">440</span> * t) + <span class="hljs-number">0.5</span> * np.sin(<span class="hljs-number">2</span> * np.pi * <span class="hljs-number">880</span> * t)

<span class="hljs-comment"># FFTで周波数解析</span>
X = np.fft.fft(x)
N = <span class="hljs-built_in">len</span>(x)
freqs = np.fft.fftfreq(N, d=<span class="hljs-number">1</span>/fs)

<span class="hljs-comment"># 正の周波数だけ取り出してプロット</span>
positive = freqs &gt; <span class="hljs-number">0</span>
plt.figure(figsize=(<span class="hljs-number">10</span>, <span class="hljs-number">4</span>))
plt.plot(freqs[positive], np.<span class="hljs-built_in">abs</span>(X[positive]))
plt.xlabel(<span class="hljs-string">&quot;周波数 (Hz)&quot;</span>); plt.ylabel(<span class="hljs-string">&quot;振幅&quot;</span>)
plt.title(<span class="hljs-string">&quot;FFTによる周波数スペクトル（440 Hz + 880 Hz）&quot;</span>)
plt.xlim(<span class="hljs-number">0</span>, <span class="hljs-number">2000</span>); plt.grid(<span class="hljs-literal">True</span>); plt.tight_layout(); plt.show()
</code></pre>
<blockquote>
<p>440 Hz と 880 Hz に鋭いピークが現れることを確認する</p>
</blockquote>

<tr>

<th>スペクトログラムの特徴</th>

<p>声道（口や喉の形）により強調される周波数帯域を<strong>フォルマント</strong>という。</p>
<table>
<thead>
<tr>
<th>母音</th>
<th>F1 (Hz)</th>
<th>F2 (Hz)</th>
<th>口の形</th>
</tr>

<tbody>
<tr>
<td>あ /a/</td>
<td>800</td>
<td>1200</td>
<td>大きく開く</td>
</tr>
<tr>
<td>い /i/</td>
<td>300</td>
<td>2500</td>
<td>横に広げる</td>
</tr>
<tr>
<td>う /u/</td>
<td>400</td>
<td>1400</td>
<td>前に突き出す（やや）</td>
</tr>
<tr>
<td>え /e/</td>
<td>500</td>
<td>1900</td>
<td>中間</td>
</tr>
<tr>

<td>500</td>
<td>800</td>

</tr>
</tbody>
</table>

<li>「い」：F2 が非常に高い（2500 Hz）→ 高域に明るい縞</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np, librosa, librosa.display, matplotlib.pyplot <span class="hljs-keyword">as</span> plt

<span class="hljs-keyword">def</span> <span class="hljs-title function_">make_vowel</span>(<span class="hljs-params">f0, formants, duration=<span class="hljs-number">0.5</span>, sr=<span class="hljs-number">22050</span></span>):
    t = np.linspace(<span class="hljs-number">0</span>, duration, <span class="hljs-built_in">int</span>(sr * duration), endpoint=<span class="hljs-literal">False</span>)
    signal = <span class="hljs-built_in">sum</span>((<span class="hljs-number">1</span>/k) * np.sin(<span class="hljs-number">2</span>*np.pi*f0*k*t) <span class="hljs-keyword">for</span> k <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1</span>, <span class="hljs-number">10</span>))
    <span class="hljs-keyword">for</span> f_f <span class="hljs-keyword">in</span> formants:
        signal += <span class="hljs-number">0.5</span> * np.sin(<span class="hljs-number">2</span>*np.pi*f_f*t)
    <span class="hljs-keyword">return</span> signal / np.<span class="hljs-built_in">max</span>(np.<span class="hljs-built_in">abs</span>(signal))

vowels = {
    <span class="hljs-string">&#x27;あ&#x27;</span>: [<span class="hljs-number">800</span>, <span class="hljs-number">1200</span>, <span class="hljs-number">2600</span>], <span class="hljs-string">&#x27;い&#x27;</span>: [<span class="hljs-number">300</span>, <span class="hljs-number">2500</span>, <span class="hljs-number">3200</span>],
    <span class="hljs-string">&#x27;う&#x27;</span>: [<span class="hljs-number">400</span>, <span class="hljs-number">1400</span>, <span class="hljs-number">2400</span>], <span class="hljs-string">&#x27;え&#x27;</span>: [<span class="hljs-number">500</span>, <span class="hljs-number">1900</span>, <span class="hljs-number">2700</span>], <span class="hljs-string">&#x27;お&#x27;</span>: [<span class="hljs-number">500</span>, <span class="hljs-number">800</span>, <span class="hljs-number">2400</span>]
}
f0, sr, n_fft, hop = <span class="hljs-number">150</span>, <span class="hljs-number">22050</span>, <span class="hljs-number">1024</span>, <span class="hljs-number">256</span>
fig, axes = plt.subplots(<span class="hljs-number">1</span>, <span class="hljs-number">5</span>, figsize=(<span class="hljs-number">18</span>, <span class="hljs-number">4</span>))

<span class="hljs-keyword">for</span> col, (name, fmts) <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(vowels.items()):

    D = librosa.stft(sig, n_fft=n_fft, hop_length=hop)
    S_db = librosa.amplitude_to_db(np.<span class="hljs-built_in">abs</span>(D), ref=np.<span class="hljs-built_in">max</span>)
    librosa.display.specshow(S_db, sr=sr, hop_length=hop,
                              x_axis=<span class="hljs-string">&#x27;time&#x27;</span>, y_axis=<span class="hljs-string">&#x27;hz&#x27;</span>,
                              ax=axes[col], cmap=<span class="hljs-string">&#x27;magma&#x27;</span>)
    axes[col].set_title(<span class="hljs-string">f&quot;「<span class="hljs-subst">{name}</span>」&quot;</span>); axes[col].set_ylim(<span class="hljs-number">0</span>, <span class="hljs-number">5000</span>)

fig.suptitle(<span class="hljs-string">&quot;日本語母音「あいうえお」のスペクトログラム比較（合成音声）&quot;</span>)
plt.tight_layout(); plt.show()

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> google.colab <span class="hljs-keyword">import</span> output
<span class="hljs-keyword">from</span> IPython.display <span class="hljs-keyword">import</span> Javascript

record_js = <span class="hljs-string">&quot;&quot;&quot;
async function recordAudio() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  return new Promise((resolve) =&gt; {
    recorder.ondataavailable = e =&gt; chunks.push(e.data);
    recorder.onstop = () =&gt; {
      const blob = new Blob(chunks, {type: &#x27;audio/webm&#x27;});
      const reader = new FileReader();
      reader.onloadend = () =&gt; resolve(reader.result);
      reader.readAsDataURL(blob);
    };
    recorder.start();
    setTimeout(() =&gt; { recorder.stop(); stream.getTracks().forEach(t=&gt;t.stop()); }, 3000);
  });
}
const result = await recordAudio();
google.colab.kernel.invokeFunction(&#x27;notebook.set_audio&#x27;, [result], {});
&quot;&quot;&quot;</span>

<p><strong>課題1（個人）：スペクトログラムを読み取ろう</strong></p>
<p>librosa のサンプル音声を使い、以下を確認する：</p>
<ol>
<li>有声音と無声音の区間を時間で特定する</li>
<li>基本周波数（<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.375ex;" xmlns="http://www.w3.org/2000/svg" width="2.442ex" height="1.913ex" role="img" focusable="false" viewBox="0 -680 1079.6 845.6"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 393 631Q388 629 386 623Q385 622 352 492L320 363H375Q378 363 398 363T426 364T448 367T472 374T489 386Q502 398 511 419T524 457T529 475Q532 480 548 480H560Q567 475 567 470Q567 467 536 339T502 207Q500 200 482 200H470Q463 206 463 212Q463 215 468 234T473 274Q473 303 453 310T364 317H309L277 190Q245 66 245 60Q245 46 334 46H359Q365 40 365 39T363 19Q359 6 353 0H336Q295 2 185 2Q120 2 86 2T48 1Z"></path></g><g data-mml-node="mn" transform="translate(676,-150) scale(0.707)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></g></svg></mjx-container>）をスペクトログラムから目視で推定する</li>

</ol>
<p><strong>課題2（任意）：自分の声で比較</strong></p>
<ol>
<li>「あ」と「い」を約1秒ずつ発声して録音</li>
<li>スペクトログラムを描画し、F1・F2 の位置の違いをスクリーンショットに矢印で示す</li>
<li>Zoomチャットに貼り付けて共有、またはメールで送る</li>
</ol>
<footer>小野原彩香 ／ 北星学園大学</footer>

<p><strong>形式</strong>：動画回（非同期）<br />

</ul>
