<h1 id="%E5%BE%93%E6%9D%A5%E5%9E%8B%E9%9F%B3%E5%A3%B0%E8%AA%8D%E8%AD%98%E3%81%AE%E5%85%A8%E4%BD%93%E3%82%A2%E3%83%BC%E3%82%AD%E3%83%86%E3%82%AF%E3%83%81%E3%83%A3">従来型音声認識の全体アーキテクチャ</h1>
<p>従来型（〜2010年代前半）は <strong>3つのモジュール</strong> で構成</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>音声波形
  ↓ [特徴量抽出]  MFCC（前回まで学習済み）
  ↓ [音響モデル]  特徴量列 → 音素列
  ↓ [言語モデル]  音素列 → 単語列（文脈を加味）
  ↓ [デコーダ]    AM + LM を組み合わせ最尤テキストを出力
認識テキスト
</code></pre>
<table>
<thead>
<tr>
<th>モジュール</th>
<th>役割</th>
<th>代表技術</th>
</tr>
</thead>
<tbody>
<tr>
<td>音響モデル（AM）</td>
<td>音の特徴量を音素に対応づける</td>
<td>GMM-HMM, DNN-HMM</td>
</tr>
<tr>
<td>言語モデル（LM）</td>
<td>単語の出現確率・文脈を学習</td>
<td>N-gram, LSTM</td>
</tr>
<tr>
<td>デコーダ</td>
<td>両モデルを統合し最尤パスを探索</td>
<td>Viterbiアルゴリズム</td>
</tr>
</tbody>
</table>
<blockquote>
<p>各モジュールは独立して設計・学習できるが、それぞれのエラーが累積する弱点もある</p>

<header>音声処理と認識｜第7回</header>
<h1 id="%E8%87%AA%E5%B7%B1%E6%95%99%E5%B8%AB%E3%81%82%E3%82%8A%E5%AD%A6%E7%BF%92%E3%81%A8%E3%81%AF">自己教師あり学習とは</h1>
<p><strong>動機</strong>：ラベル付きデータは高コスト（1時間の音声転記に〜10時間の人手作業）</p>
<p><strong>解決策</strong>：大量の<strong>ラベルなし</strong>音声データから有用な表現を学習する</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Stage 1: 事前学習]
  ラベルなし大規模データ（例：1000時間の音声）
  自己教師あり目標で学習 → 汎用的な音声表現
            ↓
[Stage 2: ファインチューニング]
  少量のラベル付きデータ（例：10時間）
  タスク特化の学習 → 高性能な認識モデル
</code></pre>
<p><strong>Masked Prediction（マスク予測）</strong></p>
<ul>
<li>テキスト（BERT）：単語をマスクして予測</li>
<li>音声（wav2vec 2.0, HuBERT）：音声フレームをマスクして予測</li>
</ul>
<blockquote>
<p>聞き取りにくい部分を文脈から推測するのに似た訓練。モデルは「音声の文脈」を学ぶ。</p>
</blockquote>
<footer>小野原彩香 ／ 北星学園大学</footer>

<h1 id="hubert%E3%82%AA%E3%83%95%E3%83%A9%E3%82%A4%E3%83%B3%E3%82%AF%E3%83%A9%E3%82%B9%E3%82%BF%E3%83%AA%E3%83%B3%E3%82%B0%E3%81%AB%E3%82%88%E3%82%8B%E5%AD%A6%E7%BF%92">HuBERT：オフラインクラスタリングによる学習</h1>
<p><strong>核心的アイデア</strong>：MFCCにk-meansをかけて<strong>擬似ラベル</strong>を作り、マスク予測で学習する</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[イテレーション0]

  ↓
[Stage 1学習]  Transformerエンコーダを擬似ラベルの分類で学習
  ↓
[イテレーション1]
  Stage 1の特徴量にk-meansクラスタリング → 改良された擬似ラベル
  ↓ 繰り返す...
</code></pre>
<table>
<thead>
<tr>
<th>項目</th>
<th>wav2vec 2.0</th>
<th>HuBERT</th>
</tr>
</thead>

<tr>
<td>離散化</td>
<td>量子化モジュール（end-to-end）</td>
<td>k-meansクラスタリング（オフライン）</td>
</tr>
<tr>
<td>損失関数</td>
<td>コントラスト学習</td>
<td>クロスエントロピー（マスク部分）</td>
</tr>
</tbody>
</table>
<footer>小野原彩香 ／ 北星学園大学</footer>

<h1 id="google-forms-%E3%83%86%E3%82%B9%E3%83%88%E5%85%A85%E5%95%8F">Google Forms テスト（全5問）</h1>
