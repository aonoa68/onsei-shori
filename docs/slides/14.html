<h2 id="%E3%83%86%E3%83%BC%E3%83%9Ec%E9%9F%B3%E5%A3%B0%E3%82%A4%E3%83%B3%E3%82%BF%E3%83%95%E3%82%A7%E3%83%BC%E3%82%B9%E3%81%AEux%E6%8F%90%E6%A1%88%E6%9B%B8">テーマC：音声インタフェースのUX提案書</h2>
<p>特定のユーザー・用途を想定した音声インタフェースのデザイン案を作成する。</p>
<p><strong>提案のフレームワーク</strong></p>
<ol>
<li>誰のための設計か（ユーザーペルソナ）</li>
<li>どんな場面で使うか（ユースケース・シナリオ）</li>
<li>音声インタフェースの設計原則（エラー対応・プライバシー配慮）</li>
<li>インクルーシブデザイン・アクセシビリティの視点</li>
<li>プロトタイプ（モックアップ・フロー図・音声サンプル等）</li>
</ol>
<p>プログラミングは任意（プロトタイプを実装する場合）。</p>
<footer>小野原彩香 ／ 北星学園大学</footer>

<h2 id="%E3%83%86%E3%83%BC%E3%83%9Ed%E9%9F%B3%E5%A3%B0deepfake%E6%A4%9C%E5%87%BA%E3%81%AE%E8%AA%BF%E6%9F%BB%E5%A0%B1%E5%91%8A">テーマD：音声Deepfake検出の調査報告</h2>
<p>音声Deepfakeの生成技術・検出技術を調査し、技術的・倫理的両面から報告する。</p>
<p><strong>構成例</strong></p>
<ol>
<li>音声Deepfakeの生成技術の概要（GAN・拡散モデル・Zero-shot TTS）</li>
<li>検出技術の現状（ASVspoof・機械学習ベース検出器）</li>
<li>社会的インパクトの事例（詐欺・政治的操作等）</li>
<li>規制・倫理ガイドラインの動向（EU AI Act等）</li>
<li>自分の見解と技術者として考えること</li>
</ol>
<footer>小野原彩香 ／ 北星学園大学</footer>

<li>日本語の方言認識の課題と展望</li>
<li>ポッドキャスト自動文字起こしの精度評価</li>
</ul>
<footer>小野原彩香 ／ 北星学園大学</footer>

<blockquote>
<p>音声処理・音声認識は「面白い技術」であると同時に、「社会と深く結びついた技術」です。</p>
<p>どんな素晴らしい技術も、それが誰かを傷つけたり、不平等を拡大したりするために使われるなら、技術者はそのことを考え続ける責任があります。</p>
<p>反対に、技術は誰かの声を届け、誰かのアクセシビリティを高め、誰かの生活を豊かにすることができます。</p>
<p>この授業がその両方を考え続けるための出発点になれば、担当者としてとても嬉しいです。</p>
</blockquote>
<footer>小野原彩香 ／ 北星学園大学</footer>
